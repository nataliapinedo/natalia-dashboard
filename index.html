<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Natalia — Project Dashboard (Interactivo)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="left">
      <h1>NATALIA — Project Dashboard</h1>
    </div>
    <div class="actions">
      <button id="newProjectBtn" class="btn primary">Nuevo proyecto</button>
      <button id="exportJsonBtn" class="btn">Exportar JSON</button>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <input id="searchInput" placeholder="Buscar proyecto..." />
      <select id="filterMarket"><option value="">Todos los mercados</option><option>Bolivia</option><option>Perú</option><option>Paraguay</option></select>
    </section>

    <section id="projectsList" class="projects">
      <!-- Project cards rendered here -->
    </section>

    <aside class="rightpanel">
      <h3>Instrucciones rápidas</h3>
      <ol>
        <li>Usa "Nuevo proyecto" para crear una ficha rápida.</li>
        <li>Cuando termines, haz "Exportar JSON" para descargar la matriz de proyectos.</li>
        <li>Para publicar online usa Netlify (drag & drop) o conecta a GitHub para deploy automático.</li>
      </ol>
    </aside>
  </main>

  <!-- Modal: New Project -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2>Nuevo proyecto</h2>
      <label>Id (corto): <input id="p_id" /></label>
      <label>Nombre: <input id="p_name" /></label>
      <label>Estado: <select id="p_status"><option>PRE-PILOTO</option><option>VALIDACIÓN</option><option>GO PILOTO</option></select></label>
      <label>Mercado: <input id="p_market" /></label>
      <label>Ciudad: <input id="p_city" /></label>
      <label>Descripción corta: <input id="p_desc" /></label>
      <div class="modal-actions">
        <button id="createProject" class="btn primary">Crear</button>
        <button id="cancel" class="btn">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
